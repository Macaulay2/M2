# Temporary review-only validation; remove before merging.
name: Review published container reuse
on:
  push:
    branches: [incremental-container-ci]
    paths: [.github/workflows/review-container-reuse.yml]
permissions:
  contents: read
  packages: read
jobs:
  reuse:
    if: github.repository == 'dimpase/M2'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      REVIEW_REVISION: 07b9dc5c3a9d3e2e463fb89aea5114f6dfdbe30d
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REVIEW_REVISION }}
          submodules: recursive
          persist-credentials: false
      - name: Export the exact published source revision
        id: snapshot
        run: python3 .github/ci/source_snapshot.py . "$RUNNER_TEMP/m2-review-source" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact published image (no clean fallback)
        env:
          CACHE_KEY: ${{ steps.snapshot.outputs.key }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/m2-ci-cmake:sha-$REVIEW_REVISION-$CACHE_KEY"
          docker pull "$image"
          echo "REVIEW_IMAGE=$(docker image inspect --format '{{.Id}}' "$image")" >> "$GITHUB_ENV"
          echo "Testing $image" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare output timestamp audit
        run: |
          cat > "$RUNNER_TEMP/audit.py" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path('/opt/m2/build')
          paths = [p for p in root.rglob('*') if p.is_file() and
                   (p.suffix in ('.o', '.a', '.so') or
                    p.name in ('M2-binary', '.cmake-installed'))]
          assert any(p.suffix == '.o' for p in paths), 'no cached objects'
          assert any(p.name == '.cmake-installed' for p in paths), 'no package stamps'
          state = {str(p.relative_to(root)): p.stat().st_mtime_ns for p in paths}
          marker = pathlib.Path('/opt/m2/review-before.json')
          if sys.argv[1] == 'before':
              marker.write_text(json.dumps(state))
          else:
              old = json.loads(marker.read_text())
              changed = sorted(k for k in old.keys() | state.keys() if old.get(k) != state.get(k))
              assert not changed, 'Unexpected rebuilt outputs: ' + repr(changed[:30])
              print('PASS: preserved timestamps for', len(state), 'compiled outputs and package stamps')
          PY
      - name: Rebuild and verify reuse
        run: |
          memory_jobs=$(awk '/MemTotal/ {print int($2 / 2097152)}' /proc/meminfo)
          jobs=$(nproc)
          (( memory_jobs < jobs )) && jobs=$memory_jobs
          (( jobs < 1 )) && jobs=1
          mkdir -p "$RUNNER_TEMP/review-results"
          docker create --name m2-review --init --cap-drop ALL --security-opt no-new-privileges \
            --env "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" \
            --mount "type=bind,source=$RUNNER_TEMP/m2-review-source,target=/input,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/audit.py,target=/audit.py,readonly" \
            "$REVIEW_IMAGE" bash -c '
              set -e
              tar -xf /opt/m2/build-cache.tar -C /opt/m2
              rm /opt/m2/build-cache.tar
              python3 /audit.py before
              bash /input/.github/ci/container-build.sh build
              tar -xf /opt/m2/build-cache.tar -C /opt/m2
              rm /opt/m2/build-cache.tar
              python3 /audit.py after
              bash /input/.github/ci/container-build.sh test'
          set -o pipefail
          docker start --attach m2-review 2>&1 | tee "$RUNNER_TEMP/review-results/reuse.log"
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/review-results"
          docker cp m2-review:/opt/m2/logs/. "$RUNNER_TEMP/review-results/" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-container-reuse
          path: ${{ runner.temp }}/review-results/
          overwrite: true
      - name: Clean up
        if: always()
        run: docker rm -f m2-review || true
