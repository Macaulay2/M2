################################################################################
#
#  Github actions trigger (workflow script) for building Macaulay2
#
#    See https://help.github.com/en/actions for the documentation.
#
################################################################################

name: Build and Test Macaulay2

on:
  workflow_dispatch:
  pull_request:
    branches:
      - stable
      - development
  push:
    branches:
      - development # seed cache after merging a PR
  schedule:
    - cron: '0 6 * * SUN' # runs tests on the main branch every Sunday at 06:00 UTC

concurrency:
  # Cancel in-progress runs when a new workflow with the same group name is triggered
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: M2/BUILD/build

env:
  # skip documentation & tests when seeding cache
  SEED_CACHE_ONLY: ${{ github.event_name == 'push' }}

jobs:
  build:
    if: github.repository == 'Macaulay2/M2' || contains(github.ref, 'global')
    name: ${{ matrix.build-system }}-${{ matrix.os }}-${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build-system:
          - autotools
          - cmake
        os:
          - ubuntu-26.04
          - macos-26
        compiler:
          - default
        include:
          # This build tests Clang rather than AppleClang (keep)
          - build-system: cmake
            os: macos-26
            compiler: brew-clang
          - build-system: cmake
            os: ubuntu-26.04
            compiler: system-libraries
          - build-system: cmake
            os: ubuntu-26.04
            compiler: custom-libraries
        exclude:
          - build-system: cmake
            os: macos-26
            compiler: default
    steps:
      - uses: actions/checkout@v6

# ----------------------
#   Install missing tools and libraries for macOS
# ----------------------

      - name: Install requirements for macOS
        if: runner.os == 'macOS'
        run: |
          brew config
          brew update
          brew trust macaulay2/tap
          brew tap macaulay2/tap
          brew install automake bison boost libtool tbb ccache ctags llvm make yasm libffi msolve googletest fplll eigen jansson r palp
          brew install texinfo || true # sometimes post-install step fails
          brew install --only-dependencies macaulay2/tap/M2
          brew link factory --force

# ----------------------
#   Install missing tools and libraries for Linux
# ----------------------

      - name: Install requirements for Linux
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y -n ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y -q --no-install-recommends libtool-bin ninja-build yasm ccache
          sudo apt-get install -y -q --no-install-recommends liblzma-dev libboost-stacktrace-dev \
                  libreadline-dev libeigen3-dev libopenblas-dev \
                  libgc-dev libgdbm-dev libglpk-dev libgmp3-dev libgtest-dev libmpfr-dev libmpfi-dev libntl-dev gfan \
                  libgivaro-dev libboost-regex-dev fflas-ffpack libflint-dev libmps-dev libfrobby-dev \
                  libsingular-dev singular-data libcdd-dev cohomcalg topcom 4ti2 libnormaliz-dev normaliz coinor-csdp \
                  libnauty-dev nauty lrslib polymake pipx phcpack libtbb-dev qepcad \
                  msolve libfplll-dev libjansson-dev r-base palp bergman

# ----------------------
#   Install Bertini
# ----------------------

      - name: Cache Bertini
        id: cache-bertini
        uses: actions/cache@v5
        with:
          path: ~/bertini
          key: bertini-${{ runner.os }}-v1.7

      - name: Download Bertini
        if: steps.cache-bertini.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/bertini
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            curl -fL https://bertini.nd.edu/BertiniLinux64_v1.7.tar.gz | tar xz --strip-components=1 -C ~/bertini
          else
            curl -fL https://bertini.nd.edu/BertiniApple_v1.7.tar.gz | tar xz --strip-components=1 -C ~/bertini
          fi

# ----------------------
#   Steps common to all build variants
# ----------------------

      - name: Set up compiler
        run: |
          case "${{ matrix.compiler }}" in
            default|system-libraries|custom-libraries)
              echo "Using default compiler"
              ;;
            brew-clang)
              echo "Using Homebrew Clang"
              echo "CC=clang"    >> $GITHUB_ENV
              echo "CXX=clang++" >> $GITHUB_ENV
              echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
              ;;
          esac

      - name: Prepare build environment
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]
          then echo "/usr/lib/ccache"                     >> $GITHUB_PATH
               echo "/home/linuxbrew/.linuxbrew/bin"      >> $GITHUB_PATH
          else echo `brew --prefix ccache`/libexec        >> $GITHUB_PATH
               echo `brew --prefix make  `/libexec/gnubin >> $GITHUB_PATH
               echo `brew --prefix libtool`/libexec/gnubin >> $GITHUB_PATH
               echo `brew --prefix bison`/bin             >> $GITHUB_PATH
          fi
          echo "$HOME/bertini" >> $GITHUB_PATH

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.build-system }}-${{ matrix.os }}-${{ matrix.compiler }}
          evict-old-files: job
          save: ${{ github.event_name == 'push' }} # to development on merge

# ----------------------
#   Configure and build M2 using CMake
# ----------------------

      - name: Install external engine libraries
        if: matrix.compiler == 'system-libraries' || matrix.compiler == 'custom-libraries'
        run: |
          prefix=/usr/local
          if [[ "${{ matrix.compiler }}" == custom-libraries ]]; then
            prefix="$RUNNER_TEMP/external"
          fi
          # Temporary post-release pins: the latest releases (memtailor 1.4,
          # mathic 1.5, mathicgb 1.4) lack the installed metadata needed here.
          # memtailor: https://github.com/Macaulay2/memtailor/pull/23
          # mathic: https://github.com/Macaulay2/mathic/pull/29 and /pull/30
          # mathicgb: https://github.com/Macaulay2/mathicgb/pull/84
          # Replace these pins with releases containing those changes when available.
          # See M2/BUILD/README.md for the revisions and release status.
          for entry in \
            memtailor:0a2afc3fff096ed06bf98b7c1c224acfc8c97dc1 \
            mathic:a08a776c8973a4c25f44d7d769ba949766f3f13c \
            mathicgb:74e3708f52f989ac1bd698412d2ee67d6ef43b6d; do
            lib=${entry%%:*}
            git clone "https://github.com/Macaulay2/$lib" "$RUNNER_TEMP/$lib"
            git -C "$RUNNER_TEMP/$lib" checkout "${entry#*:}"
            cmake -S "$RUNNER_TEMP/$lib" -B "$RUNNER_TEMP/$lib-build" -GNinja \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_INSTALL_PREFIX="$prefix" -DCMAKE_PREFIX_PATH="$prefix" \
              -DCMAKE_INSTALL_LIBDIR=lib -Dwith_tbb=ON
            cmake --build "$RUNNER_TEMP/$lib-build" --parallel 4
            sudo cmake --install "$RUNNER_TEMP/$lib-build"
          done
          echo "$prefix/lib" | sudo tee /etc/ld.so.conf.d/m2-external.conf
          sudo ldconfig
          if [[ "${{ matrix.compiler }}" == custom-libraries ]]; then
            # Exercise pkg-config without CMake package metadata.
            sudo rm -r "$prefix/lib/cmake"
            echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
            # Exercise deinit on populated checkouts; downloaded repositories remain cached.
            git -C ../../.. submodule update --init -- \
              M2/submodules/memtailor M2/submodules/mathic M2/submodules/mathicgb
          fi
          git -C ../../.. submodule deinit --all

      - name: Configure Macaulay2 using CMake
        if: matrix.build-system == 'cmake'
        run: |
          update_submodules=ON
          if [[ "${{ matrix.compiler }}" == *-libraries ]]; then update_submodules=OFF; fi
          cmake -S../.. -B. -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_NATIVE=OFF -DGIT_SUBMODULE="$update_submodules" \
            -DCMAKE_PREFIX_PATH="`brew --prefix`;`brew --prefix libffi`" \
            -DCMAKE_INSTALL_PREFIX=/usr \
            --debug-trycompile

      - name: Build libraries using Ninja
        if: matrix.build-system == 'cmake'
        run: |
          cmake --build . --target build-libraries build-programs

      - name: Build Macaulay2 using Ninja
        if: matrix.build-system == 'cmake'
        run: |
          if [[ "${{ matrix.compiler }}" == *-libraries ]]; then
            cmake --build . --target M2-core M2-editors M2-unit-tests --parallel 4
            ninja -t targets all > targets.txt
            if grep -E '^(build-(bdwgc|flint|frobby|givaro|fflas_ffpack|googletest|memtailor|mathic|mathicgb)|M2-emacs):' targets.txt; then exit 1; fi
            ninja -t deps > headers.txt
            if grep -E '/submodules/|/e/(memtailor|mathic|mathicgb)/|/editors/emacs/' headers.txt; then exit 1; fi
            ./M2 -q --check 1
            ctest -j1 --output-on-failure -R unit-tests
          else
            cmake --build . --target M2-core M2-emacs
          fi

      - name: Install packages using Ninja
        if: matrix.build-system == 'cmake' && !endsWith(matrix.compiler, '-libraries') && env.SEED_CACHE_ONLY != 'true'
        run: |
          cmake --build . --target install-packages
          if [[ "${{ runner.os }}" == "Linux" ]]; then
              sudo apt-get install -y -q --no-install-recommends dpkg-dev
              echo "GIT_COMMIT=`git describe --dirty --always --match HEAD`" >> $GITHUB_ENV
              cpack -G DEB
          fi

# ----------------------
#   Configure and build M2 using Autotools
# ----------------------

      - name: Configure Macaulay2 using Autotools
        if: matrix.build-system == 'autotools'
        run: |
          ../../autogen.sh
          export F77=gfortran-14
          export FC=gfortran-14
          ../../configure --with-system-gc --with-fplll

      - name: Build libraries using Make
        if: matrix.build-system == 'autotools'
        run: |
          make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu) -C libraries

      - name: Build Macaulay2 using Make
        if: matrix.build-system == 'autotools'
        run: |
          make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu) PACKAGES=

      - name: Install packages using Make
        if: matrix.build-system == 'autotools' && env.SEED_CACHE_ONLY != 'true'
        run: |
          make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

# ----------------------
#   Run tests
# ----------------------

      - name: Run Tests using CTest
        if: matrix.build-system == 'cmake' && runner.os == 'macOS' && env.SEED_CACHE_ONLY != 'true'
        run: |
          set -xe
          ./M2 -q --check 1
          ./M2 -q --check 2
          ./M2 -q --check 3
          cmake --build . --target M2-tests
          cmake --build . --target M2-unit-tests
          cmake --build . --target memtailor-unit-tests mathic-unit-tests mathicgb-unit-tests
          ctest -j1 --output-on-failure -R "unit-tests"
          ctest -j4 --output-on-failure -R "ComputationsBook"
          # TODO: add Macaulay2/tests/engine when https://github.com/Macaulay2/M2/issues/1213 is fixed

      - name: Run Tests using Autotools
        if: matrix.build-system == 'autotools' && runner.os == 'Linux' && matrix.compiler == 'default' && env.SEED_CACHE_ONLY != 'true'
        run: |
          make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu) check -o check-in-libraries
          make -C Macaulay2/html-check-links check

      - name: Validate HTML documentation
        if: matrix.build-system == 'autotools' && runner.os == 'Linux' && env.SEED_CACHE_ONLY != 'true'
        run: |
          pipx install html5validator
          if test ${{ github.event_name }} = pull_request
          then
            git fetch --depth=1 origin development
            # validate everything if any changes to Core
            if test "$(git diff --stat origin/development HEAD -- ../../Macaulay2/m2)"
            then
              make validate-html
            else
            # otherwise, just validate HTML docs for packages that have been updated
              PACKAGES=$(git diff --stat origin/development HEAD -- ../../Macaulay2/packages/ | grep -Po "(?<=Macaulay2/packages/)[^/\.]*(?=\.m2|/)" | uniq | sed 's/undistributed-packages//g' | xargs)
              make validate-html PACKAGES="$PACKAGES"
            fi
          else
            # if not a pull request (scheduled or pre-master builds), then validate everything
            make validate-html
          fi

# ----------------------
#   Upload build artifacts
# ----------------------

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
           name: ${{ matrix.build-system }}-${{ matrix.os }}-${{ matrix.compiler }}-logs
           path: |
             # Autotools
             M2/BUILD/build/config.log
             M2/BUILD/build/check-configure/tmp/config.log
             M2/BUILD/build/include/*
             M2/BUILD/build/libraries/*/build/*/config.log
             # CMake
             M2/BUILD/build/CMakeCache.txt
             M2/BUILD/build/CMakeFiles/CMakeError.log
             M2/BUILD/build/CMakeFiles/CMakeOutput.log
             M2/BUILD/build/CMakeFiles/CMakeConfigureLog.yaml
             M2/BUILD/build/libraries/*/build/config.log
             # package example errors
             M2/BUILD/build/usr-dist/common/share/doc/Macaulay2/*/example-output/*.errors
             # package test errors under Ubuntu
             /tmp/M2-*/*.tmp
             /tmp/M2-*/*.m2
             # Test errors
             M2/BUILD/build/Macaulay2/tests/*/*.errors

      - name: Upload Macaulay2 package for Ubuntu (x86_64)
        if: matrix.build-system == 'cmake' && matrix.compiler == 'default' && runner.os == 'Linux' && success() && env.SEED_CACHE_ONLY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Macaulay2-${{ env.GIT_COMMIT }}-ubuntu-x86_64
          path: |
            M2/BUILD/build/Macaulay2-*
          retention-days: 1
