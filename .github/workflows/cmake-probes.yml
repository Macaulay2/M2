name: CMake optional dependency probes

on:
  push:
    paths:
      - M2/cmake/FindMaple.cmake
      - M2/cmake/check-libraries.cmake
      - M2/cmake/configure.cmake
      - M2/cmake/tests/test_find_maple.py
      - .github/workflows/cmake-probes.yml
  pull_request:
    paths:
      - M2/cmake/FindMaple.cmake
      - M2/cmake/check-libraries.cmake
      - M2/cmake/configure.cmake
      - M2/cmake/tests/test_find_maple.py
      - .github/workflows/cmake-probes.yml

permissions:
  contents: read

jobs:
  maple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Other tests in this directory need an installed M2. This job only
      # exercises the standalone Maple probes.
      - run: python3 M2/cmake/tests/test_find_maple.py -v
