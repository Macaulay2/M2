# This workflow builds a macOS DMG for distributing Macaulay2.
# It runs on both Intel (x86_64) and Apple Silicon (arm64) runners.
#
# The resulting DMG presents a Macaulay2-VERSION directory alongside a
# shortcut to /Applications so users can drag it there.  After installation,
# users add /Applications/Macaulay2-VERSION/bin to their PATH.
#
# The DMG is built and tested in separate jobs so that it is tested on a
# runner without the Homebrew formulas it was built against.

name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'DMG revision (bump when rebuilding a released version)'
        required: false
        default: '1'
  push:
    tags:
      - 'release-*'

env:
  DMG_REVISION: ${{ inputs.revision || '1' }}

defaults:
  run:
    working-directory: M2/BUILD/dmg

jobs:
  build-dmg:
    name: Build DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            deployment_target: "14.0"
          - os: macos-15-intel
            arch: x86_64
            deployment_target: "15.0"

    steps:
      - uses: actions/checkout@v6

# ----------------------
#   Install Homebrew dependencies
# ----------------------

      - name: Install requirements
        run: |
          brew config
          brew update
          brew trust macaulay2/tap
          brew tap macaulay2/tap
          # Build tools
          brew install automake bison dylibbundler ccache ctags llvm make yasm googletest r
          brew install texinfo || true
          # M2 library dependencies
          brew install \
              bdw-gc boost eigen fplll jansson libffi tbb \
              macaulay2/tap/factory fflas-ffpack flint frobby givaro \
              mpfi mpsolve ntl \
              memtailor mathic mathicgb
          brew link macaulay2/tap/factory --force
          # External programs bundled into the DMG
          brew install 4ti2 cohomcalg csdp gfan lrs msolve nauty normaliz topcom

# ----------------------
#   Set up build environment
# ----------------------

      - name: Prepare build environment
        run: |
          echo "$(brew --prefix ccache)/libexec"         >> $GITHUB_PATH
          echo "$(brew --prefix make)/libexec/gnubin"    >> $GITHUB_PATH
          echo "$(brew --prefix libtool)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin"              >> $GITHUB_PATH
          echo "CPPFLAGS=-I$(brew --prefix)/include -I$(brew --prefix libomp)/include -I$(brew --prefix readline)/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix)/lib -L$(brew --prefix libomp)/lib -L$(brew --prefix readline)/lib"             >> $GITHUB_ENV
          M2_VERSION=$(cat ../../VERSION)
          echo "M2_VERSION=$M2_VERSION"         >> $GITHUB_ENV
          echo "PKG_NAME=Macaulay2-$M2_VERSION" >> $GITHUB_ENV

# ----------------------
#   Download external programs not available on Homebrew
# ----------------------

      - name: Download external programs
        run: |
          # phcpack (universal binary)
          curl -fsSL https://github.com/janverschelde/PHCpack/releases/download/v2.4.92/macphc \
            -o "$RUNNER_TEMP/phc"
          chmod +x "$RUNNER_TEMP/phc"

          # bertini (arm64 only)
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            curl -fsSL https://bertini.nd.edu/BertiniApple_v1.7.tar.gz \
              | tar -xz -C "$RUNNER_TEMP"
            cp "$RUNNER_TEMP/BertiniApple_v1.7/bertini" "$RUNNER_TEMP/bertini"
            chmod +x "$RUNNER_TEMP/bertini"
          fi

# ----------------------
#   Build Macaulay2 and create DMG
# ----------------------

      - name: Build and package Macaulay2
        env:
          WORKSPACE: ${{ github.workspace }}
          ARCH: ${{ matrix.arch }}
          DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: make all

# ----------------------
#   Upload artifacts
# ----------------------

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.arch }}-logs
          path: |
            M2/BUILD/build/config.log
            M2/BUILD/build/include/*
            M2/BUILD/build/libraries/*/build/*/config.log

      - name: Upload DMG
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}-${{ env.DMG_REVISION }}-${{ matrix.arch }}-macOS
          path: "*.dmg"
          retention-days: 7

# ----------------------
#   Test the DMG
# ----------------------

# This runs on a fresh runner that never installed the Homebrew formulas
# used to build Macaulay2, so anything the DMG failed to bundle -- a dylib,
# an external program, a data file such as Factory's gftables -- is missing
# here just as it would be on a user's machine.  See issue #4596.
#
# GNU make is the one exception; see the step below.

  test-dmg:
    name: Test DMG (${{ matrix.arch }})
    needs: build-dmg
    # "needs" waits on the entire build-dmg matrix, so without this the whole
    # test job is skipped whenever a single architecture fails to build -- we
    # would lose the arm64 test results just because the x86_64 build broke.
    # Run anyway; the architecture that failed to build has no DMG to download
    # and fails below, which is what we want to see.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    steps:
      # We do not build anything here, but the steps below run targets from
      # M2/BUILD/dmg/Makefile and need M2/VERSION to name the artifact, so
      # check out those two paths and nothing else.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /M2/BUILD/dmg/
            /M2/VERSION
          sparse-checkout-cone-mode: false

      # M2/BUILD/dmg/Makefile needs GNU make 3.82 or later for .ONESHELL and
      # .SHELLFLAGS; macOS ships 3.81.  This is a build tool rather than a
      # library, so installing it does not weaken the test above.
      - name: Install GNU make
        run: |
          brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Determine package name
        run: |
          M2_VERSION=$(cat ../../VERSION)
          echo "PKG_NAME=Macaulay2-$M2_VERSION" >> $GITHUB_ENV

      - name: Download DMG
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}-${{ env.DMG_REVISION }}-${{ matrix.arch }}-macOS
          path: ${{ github.workspace }}

      - name: Install DMG
        env:
          WORKSPACE: ${{ github.workspace }}
          ARCH: ${{ matrix.arch }}
        run: make install-dmg

      - name: Run basic tests
        env:
          WORKSPACE: ${{ github.workspace }}
          ARCH: ${{ matrix.arch }}
        run: make run-basic-tests

      - name: Run core tests
        env:
          WORKSPACE: ${{ github.workspace }}
          ARCH: ${{ matrix.arch }}
        run: make run-core-tests

      - name: Run package tests
        # x86_64 runners are too slow and time out on --check 3
        if: matrix.arch == 'arm64'
        env:
          WORKSPACE: ${{ github.workspace }}
          ARCH: ${{ matrix.arch }}
        run: make run-package-tests
