name: Incremental CMake container

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      clean:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      revision: ${{ steps.snapshot.outputs.revision }}
      key: ${{ steps.snapshot.outputs.key }}
    env:
      DEVELOPMENT_BRANCH: ${{ vars.M2_CI_DEVELOPMENT_BRANCH || 'development' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select repository registry namespace
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/m2-ci-cmake" >> "$GITHUB_ENV"

      - name: Test snapshot and cache handling
        run: python3 -m unittest discover -s .github/ci -p 'test_*.py' -v

      - name: Export the tested revision
        id: snapshot
        run: python3 .github/ci/source_snapshot.py . "$RUNNER_TEMP/m2-source" >> "$GITHUB_OUTPUT"

      - name: Select development image or build a clean environment
        id: image
        env:
          CACHE_KEY: ${{ steps.snapshot.outputs.key }}
          CLEAN: ${{ inputs.clean }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          image=
          if [[ "$CLEAN" != true ]]; then
            for candidate in "$IMAGE:sha-$BASE_REVISION-$CACHE_KEY" "$IMAGE:development-$CACHE_KEY"; do
              if docker pull "$candidate"; then
                # Freeze the selection even if another job updates the registry tag.
                image=$(docker image inspect --format '{{.Id}}' "$candidate")
                echo "Using development build $candidate ($image)" >> "$GITHUB_STEP_SUMMARY"
                break
              fi
            done
          fi
          if [[ -z "$image" ]]; then
            echo "Cache unavailable or clean build requested; building from scratch." >> "$GITHUB_STEP_SUMMARY"
            docker build -t m2-ci-environment \
              -f "$RUNNER_TEMP/m2-source/M2/BUILD/docker/incremental/Dockerfile" \
              "$RUNNER_TEMP/m2-source"
            image=m2-ci-environment
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build runtime and install packages
        env:
          BASE_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/m2-results"
          # Allow about 2 GiB per concurrent job, up to the runner CPU count.
          memory_jobs=$(awk '/MemTotal/ {print int($2 / 2097152)}' /proc/meminfo)
          jobs=$(nproc)
          (( memory_jobs < jobs )) && jobs=$memory_jobs
          (( jobs < 1 )) && jobs=1
          echo "Build parallelism: $jobs jobs" >> "$GITHUB_STEP_SUMMARY"
          docker create --name m2-ci --init --cap-drop ALL --security-opt no-new-privileges \
            --env "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" \
            --mount "type=bind,source=$RUNNER_TEMP/m2-source,target=/input,readonly" \
            "$BASE_IMAGE" bash /input/.github/ci/container-build.sh build
          set -o pipefail
          docker start --attach m2-ci 2>&1 | tee "$RUNNER_TEMP/m2-results/build.log"

      - name: Save intermediate build state
        run: |
          mkdir -p "$RUNNER_TEMP/m2-state"
          docker export m2-ci > "$RUNNER_TEMP/m2-state/filesystem.tar"

      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: cmake-intermediate-build
          path: ${{ runner.temp }}/m2-state/filesystem.tar
          compression-level: 1
          retention-days: 2

      - name: Collect logs and Debian packages
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/m2-results" "$RUNNER_TEMP/m2-debs"
          if docker container inspect m2-ci >/dev/null 2>&1; then
            docker cp m2-ci:/opt/m2/logs/. "$RUNNER_TEMP/m2-results/" || true
            docker cp m2-ci:/opt/m2/artifacts/. "$RUNNER_TEMP/m2-debs/" || true
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          overwrite: true
          name: cmake-ubuntu-container-build-logs
          path: ${{ runner.temp }}/m2-results/

      - name: Remove the temporary container
        if: always()
        run: docker rm -f m2-ci || true

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DEVELOPMENT_BRANCH: ${{ vars.M2_CI_DEVELOPMENT_BRANCH || 'development' }}
    steps:
      - name: Select repository registry namespace
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/m2-ci-cmake" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: cmake-intermediate-build
          path: ${{ runner.temp }}/m2-state

      - name: Restore build container
        run: |
          docker import \
            --change 'USER 10001:10001' \
            --change 'ENV HOME=/home/builder TZ=Etc/UTC DEBIAN_FRONTEND=noninteractive' \
            --change 'WORKDIR /opt/m2' --change 'CMD ["bash"]' \
            "$RUNNER_TEMP/m2-state/filesystem.tar" m2-ci-built
          rm "$RUNNER_TEMP/m2-state/filesystem.tar"

      - name: Test packages and runtime, and create Debian packages
        env:
          SAVE_BUILD_CACHE: ${{ inputs.publish }}
        run: |
          mkdir -p "$RUNNER_TEMP/m2-results"
          memory_jobs=$(awk '/MemTotal/ {print int($2 / 2097152)}' /proc/meminfo)
          jobs=$(nproc)
          (( memory_jobs < jobs )) && jobs=$memory_jobs
          (( jobs < 1 )) && jobs=1
          echo "Test parallelism: $jobs jobs" >> "$GITHUB_STEP_SUMMARY"
          docker create --name m2-ci --init --cap-drop ALL --security-opt no-new-privileges \
            --env "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" --env SAVE_BUILD_CACHE \
            m2-ci-built bash -c 'tar -xf /opt/m2/build-cache.tar -C /opt/m2 && rm /opt/m2/build-cache.tar && exec bash /opt/m2/source/.github/ci/container-build.sh test'
          set -o pipefail
          docker start --attach m2-ci 2>&1 | tee "$RUNNER_TEMP/m2-results/test.log"

      - name: Collect logs and Debian packages
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/m2-results" "$RUNNER_TEMP/m2-debs"
          if docker container inspect m2-ci >/dev/null 2>&1; then
            docker cp m2-ci:/opt/m2/logs/. "$RUNNER_TEMP/m2-results/" || true
            docker cp m2-ci:/opt/m2/artifacts/. "$RUNNER_TEMP/m2-debs/" || true
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          overwrite: true
          name: cmake-ubuntu-container-test-logs
          path: ${{ runner.temp }}/m2-results/

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          overwrite: true
          name: Macaulay2-${{ needs.build.outputs.revision }}-ubuntu-x86_64
          path: ${{ runner.temp }}/m2-debs/*.deb
          if-no-files-found: error
          retention-days: 1

      # Publication is allowed only for the trusted development branch. No token
      # or Docker socket is ever passed into the build container.
      - name: Log in to GitHub Container Registry
        if: inputs.publish && github.ref == format('refs/heads/{0}', vars.M2_CI_DEVELOPMENT_BRANCH || 'development') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish successful development build
        if: inputs.publish && github.ref == format('refs/heads/{0}', vars.M2_CI_DEVELOPMENT_BRANCH || 'development') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          REVISION: ${{ needs.build.outputs.revision }}
          CACHE_KEY: ${{ needs.build.outputs.key }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Flatten the filesystem so successive snapshots do not accumulate old
          # object files in an ever-growing chain of container layers.
          image="$IMAGE:sha-$REVISION-$CACHE_KEY"
          docker export m2-ci | docker import \
            --change 'USER 10001:10001' \
            --change 'ENV HOME=/home/builder TZ=Etc/UTC DEBIAN_FRONTEND=noninteractive' \
            --change 'WORKDIR /opt/m2' --change 'CMD ["bash"]' \
            --change "LABEL org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --change "LABEL org.opencontainers.image.revision=$REVISION" \
            --change "LABEL org.macaulay2.ci.cache-key=$CACHE_KEY" - "$image"
          docker push "$image"
          # Do not advance the alias for a revision already superseded on development.
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEVELOPMENT_BRANCH" --jq .object.sha)
          if [[ "$head" == "$REVISION" ]]; then
            docker tag "$image" "$IMAGE:development-$CACHE_KEY"
            docker push "$IMAGE:development-$CACHE_KEY"
          fi
          echo "Published $image" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary container
        if: always()
        run: docker rm -f m2-ci || true
